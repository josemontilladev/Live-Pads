<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self' data:">
  <title>LivePads</title>
  <style>
    :root { --bg: #101014; --text: #f4f4f5; --muted: #a1a1aa; --accent: #f5a524; --on-accent: #0a0a14; --line: rgba(255,255,255,.12); }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; overflow: hidden; background: var(--bg); color: var(--text); font: 13px/1.25 'Inter', system-ui, 'Segoe UI', sans-serif; user-select: none; }
    body { -webkit-app-region: drag; display: flex; flex-direction: column; justify-content: center; gap: 6px; padding: 10px 12px; border: 1px solid var(--line); border-radius: 10px; }
    .row { display: flex; align-items: center; gap: 10px; min-width: 0; }
    .info { flex: 1; min-width: 0; }
    .title { font-weight: 700; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .sub { color: var(--muted); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .sub b { color: var(--accent); font-weight: 700; }
    button { -webkit-app-region: no-drag; flex: none; width: 34px; height: 34px; border-radius: 50%; border: 1px solid var(--line); background: rgba(255,255,255,.06); color: var(--text); cursor: pointer; display: grid; place-items: center; padding: 0; }
    button:hover { background: rgba(255,255,255,.14); }
    button:active { transform: scale(.94); }
    button.play { width: 40px; height: 40px; background: var(--accent); color: var(--on-accent); border-color: var(--accent); }
    button.play:hover { filter: brightness(1.08); }
    button.x { width: 22px; height: 22px; border: 0; background: transparent; color: var(--muted); font-size: 12px; align-self: flex-start; }
    button.x:hover { color: var(--text); background: rgba(255,255,255,.1); }
    button:disabled { opacity: .35; cursor: default; }
    .bar { position: relative; height: 4px; border-radius: 2px; background: rgba(255,255,255,.12); overflow: hidden; }
    .bar i { position: absolute; inset: 0 auto 0 0; width: 0; background: var(--accent); border-radius: 2px; }
    .time { color: var(--muted); font-size: 11px; font-variant-numeric: tabular-nums; flex: none; }
  </style>
</head>
<body>
  <div class="row">
    <button type="button" class="play" data-cmd="toggle" title="Reproducir / pausar" aria-label="Reproducir o pausar"><svg data-ref="icon" viewBox="0 0 24 24" width="18" height="18" fill="currentColor"><polygon points="6,4 20,12 6,20"/></svg></button>
    <div class="info"><div class="title" data-ref="title">LivePads</div><div class="sub" data-ref="sub"></div></div>
    <button type="button" data-cmd="next" title="Siguiente canción del servicio" aria-label="Siguiente canción"><svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor"><polygon points="5,5 15,12 5,19"/><rect x="16" y="5" width="3" height="14" rx="1"/></svg></button>
    <button type="button" data-cmd="restore" title="Volver a LivePads" aria-label="Volver a LivePads"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 3h6v6M9 21H3v-6M21 3l-7 7M3 21l7-7"/></svg></button>
    <button type="button" class="x" data-cmd="close" title="Ocultar (vuelve la próxima vez que minimices)" aria-label="Ocultar">✕</button>
  </div>
  <div class="row"><div class="bar" style="flex:1"><i data-ref="bar"></i></div><span class="time" data-ref="time"></span></div>
  <script type="module" src="js/miniWindow.js"></script>
</body>
</html>
