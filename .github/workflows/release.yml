name: Release

# Build + publish the Windows installer to GitHub Releases whenever a
# version tag is pushed (e.g. v1.0.1). The published release includes the
# .exe, latest.yml and .blockmap that electron-updater needs, so installed
# apps update themselves automatically.
#
# Release flow (run locally):
#   npm version patch    # bumps package.json + commits + creates tag vX.Y.Z
#   git push --follow-tags
# (use `minor` / `major` instead of `patch` as needed)

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write   # let GITHUB_TOKEN create the release + upload assets

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          # 22+: `node --test` necesita los comodines (tests/**/*.test.mjs).
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Antes de compilar: pruebas unitarias y de interfaz (Electron real con
      # un perfil temporal). Si algo falla, no se publica la versión.
      - name: Unit tests
        run: npm test

      - name: UI tests
        run: npm run test:ui

      - name: Build and publish (packages, uploads to Release)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Inicio con Google de escritorio (scripts/write-google-secret.mjs lo escribe en el build).
          GOOGLE_DESKTOP_CLIENT_SECRET: ${{ secrets.GOOGLE_DESKTOP_CLIENT_SECRET }}
        run: npm run release

      - name: Release notes on the GitHub page (from NOVEDADES.md)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "${{ github.ref_name }}" --notes-file NOVEDADES.md
